<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拍照预约 · VIP贵宾专属</title>
    <style>
      :root {
        --primary: #6d5efc;
        --primary-dark: #5a4de0;
        --primary-light: #8b7fff;
        --primary-soft: #efeefe;
        --accent-grad: linear-gradient(135deg, #6d5efc 0%, #9d8aff 100%);
        --bg: #eef0f7;
        --card: #ffffff;
        --text: #1a1a2e;
        --text-muted: #6b7280;
        --text-light: #9ca3af;
        --border: #eceef4;
        --success: #10b981;
        --success-bg: #ecfdf5;
        --error: #ef4444;
        --error-bg: #fef2f2;
        --full: #f43f5e;
        --full-bg: #fff1f2;
        --warn: #f59e0b;
        --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
        --shadow-md: 0 4px 16px rgba(16, 24, 40, 0.06);
        --shadow-lg: 0 12px 40px rgba(109, 94, 252, 0.12);
        --radius: 16px;
        --radius-sm: 10px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          "PingFang SC",
          "Microsoft Yahei",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        background: var(--bg);
        background-image:
          radial-gradient(
            circle at 0% 0%,
            rgba(109, 94, 252, 0.08),
            transparent 40%
          ),
          radial-gradient(
            circle at 100% 100%,
            rgba(157, 138, 255, 0.08),
            transparent 40%
          );
        min-height: 100vh;
        padding: 24px 16px;
        color: var(--text);
        line-height: 1.5;
      }
      .wrapper {
        max-width: 680px;
        margin: 0 auto;
      }

      /* ===== 顶部品牌区 ===== */
      .hero {
        background: var(--accent-grad);
        border-radius: 24px;
        padding: 36px 32px 30px;
        color: #fff;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 36px rgba(109, 94, 252, 0.28);
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -60px;
        right: -40px;
        width: 180px;
        height: 180px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 50%;
      }
      .hero::after {
        content: "";
        position: absolute;
        bottom: -50px;
        left: -30px;
        width: 130px;
        height: 130px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(8px);
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        margin-bottom: 14px;
        position: relative;
        z-index: 1;
      }
      .hero h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1px;
        position: relative;
        z-index: 1;
      }
      .hero p {
        font-size: 13.5px;
        opacity: 0.9;
        margin-top: 6px;
        position: relative;
        z-index: 1;
      }

      /* ===== 主卡片 ===== */
      .card {
        background: var(--card);
        border-radius: var(--radius);
        margin-top: -18px;
        padding: 28px 26px 30px;
        box-shadow: var(--shadow-lg);
        position: relative;
        z-index: 2;
      }

      /* ===== 步骤指示 ===== */
      .steps {
        display: flex;
        gap: 8px;
        margin-bottom: 26px;
      }
      .step {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--text-light);
        font-weight: 500;
      }
      .step-num {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--border);
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
        transition: all 0.3s;
      }
      .step.active .step-num {
        background: var(--accent-grad);
        color: #fff;
        box-shadow: 0 4px 12px rgba(109, 94, 252, 0.35);
      }
      .step.active {
        color: var(--primary);
      }
      .step-line {
        flex: 0 0 12px;
        height: 2px;
        background: var(--border);
        border-radius: 2px;
        align-self: center;
        margin: 0 -2px;
      }

      /* ===== 区块标题 ===== */
      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 14px;
      }
      .section-title .dot {
        width: 4px;
        height: 16px;
        background: var(--accent-grad);
        border-radius: 4px;
      }
      .section-title .hint {
        margin-left: auto;
        font-size: 12px;
        font-weight: 400;
        color: var(--text-light);
      }
      .section + .section {
        margin-top: 30px;
      }

      /* ===== 日历 ===== */
      .calendar {
        background: #fafbff;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 16px;
      }
      .cal-month {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cal-month + .cal-month {
        margin-top: 14px;
      }
      .cal-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        margin-bottom: 6px;
      }
      .cal-weekday {
        text-align: center;
        font-size: 11px;
        color: var(--text-light);
        font-weight: 500;
        padding: 4px 0;
      }
      .cal-weekday.we {
        color: var(--full);
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .cal-day {
        aspect-ratio: 1;
        border: none;
        background: #fff;
        border-radius: 8px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        transition: all 0.18s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border: 1px solid transparent;
      }
      .cal-day:hover:not(.disabled):not(.active) {
        border-color: var(--primary-light);
        background: var(--primary-soft);
        transform: translateY(-1px);
      }
      .cal-day.disabled {
        color: var(--text-light);
        opacity: 0.35;
        cursor: not-allowed;
        background: transparent;
      }
      .cal-day.active {
        background: var(--accent-grad);
        color: #fff;
        box-shadow: 0 4px 14px rgba(109, 94, 252, 0.4);
        transform: translateY(-1px);
      }
      .cal-day.we {
        color: var(--full);
      }
      .cal-day.active.we {
        color: #fff;
      }
      .cal-empty {
        aspect-ratio: 1;
      }
      .cal-legend {
        display: flex;
        gap: 14px;
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--text-muted);
        flex-wrap: wrap;
      }
      .cal-legend span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .cal-legend i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        display: inline-block;
      }

      /* ===== 时段列表 ===== */
      .slots-wrap {
        min-height: 60px;
      }
      .slots-empty {
        text-align: center;
        padding: 30px 16px;
        color: var(--text-light);
        font-size: 13.5px;
      }
      .slots-empty .ico {
        font-size: 30px;
        display: block;
        margin-bottom: 8px;
        opacity: 0.5;
      }
      .slot-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .slot-card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .slot-card:hover:not(.full) {
        border-color: var(--primary-light);
        background: var(--primary-soft);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .slot-card.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        box-shadow: 0 6px 18px rgba(109, 94, 252, 0.2);
      }
      .slot-card.active::after {
        content: "✓";
        position: absolute;
        top: 8px;
        right: 10px;
        width: 20px;
        height: 20px;
        background: var(--accent-grad);
        color: #fff;
        border-radius: 50%;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .slot-card.full {
        background: var(--full-bg);
        border-color: #ffe4e6;
        cursor: not-allowed;
        opacity: 0.75;
      }
      .slot-time {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
      }
      .slot-card.full .slot-time {
        color: var(--full);
      }
      .slot-bar {
        height: 6px;
        background: #eef0f7;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .slot-bar-fill {
        height: 100%;
        border-radius: 999px;
        transition: width 0.4s ease;
      }
      .slot-bar-fill.ok {
        background: linear-gradient(90deg, #6d5efc, #9d8aff);
      }
      .slot-bar-fill.warn {
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
      }
      .slot-bar-fill.full {
        background: var(--full);
      }
      .slot-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        color: var(--text-muted);
      }
      .slot-card.full .slot-meta {
        color: var(--full);
      }
      .slot-tag {
        font-weight: 600;
      }

      /* ===== 表单 ===== */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 14px;
      }
      .form-item {
        margin-bottom: 0;
      }
      .form-item.full {
        grid-column: 1 / -1;
      }
      .form-item label {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .form-item label .req {
        color: var(--error);
      }
      .form-item input,
      .form-item textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 14.5px;
        background: #fafbff;
        color: var(--text);
        transition: all 0.2s;
        font-family: inherit;
      }
      .form-item input::placeholder,
      .form-item textarea::placeholder {
        color: var(--text-light);
      }
      .form-item input:focus,
      .form-item textarea:focus {
        outline: none;
        border-color: var(--primary);
        background: #fff;
        box-shadow: 0 0 0 4px rgba(109, 94, 252, 0.1);
      }
      .form-item textarea {
        min-height: 76px;
        resize: vertical;
      }

      /* ===== 提交按钮 ===== */
      .btn {
        width: 100%;
        padding: 15px;
        background: var(--accent-grad);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-top: 24px;
        cursor: pointer;
        transition: all 0.25s;
        box-shadow: 0 8px 24px rgba(109, 94, 252, 0.3);
        position: relative;
        overflow: hidden;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(109, 94, 252, 0.4);
      }
      .btn:active:not(:disabled) {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -3px;
        margin-right: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== 提示消息 ===== */
      .msg {
        margin-top: 16px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 16px;
        border-radius: 10px;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .msg.show {
        display: flex;
        animation: slideIn 0.3s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .msg.ok {
        background: var(--success-bg);
        color: var(--success);
      }
      .msg.error {
        background: var(--error-bg);
        color: var(--error);
      }

      .footer-note {
        text-align: center;
        font-size: 12px;
        color: var(--text-light);
        margin-top: 20px;
        padding-bottom: 8px;
      }

      /* ===== 响应式 ===== */
      @media (max-width: 520px) {
        body {
          padding: 12px 10px;
        }
        .hero {
          padding: 28px 22px 24px;
          border-radius: 20px;
        }
        .hero h1 {
          font-size: 22px;
        }
        .card {
          padding: 22px 18px 24px;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
        .slot-grid {
          grid-template-columns: 1fr;
        }
        .step span:last-child {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- 顶部品牌区 -->
      <div class="hero">
        <div class="hero-badge">✦ VIP 贵宾专属通道</div>
        <h1>拍照预约</h1>
        <p>2026.08.21 — 09.02 · 专业化妆师一对一服务</p>
      </div>

      <!-- 主卡片 -->
      <div class="card">
        <!-- 步骤 -->
        <div class="steps">
          <div class="step active" id="step1">
            <div class="step-num">1</div>
            <span>选日期</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step2">
            <div class="step-num">2</div>
            <span>选时段</span>
          </div>
          <div class="step-line"></div>
          <div class="step" id="step3">
            <div class="step-num">3</div>
            <span>填信息</span>
          </div>
        </div>

        <!-- 区块：选择日期 -->
        <div class="section">
          <div class="section-title">
            <span class="dot"></span>
            选择预约日期
            <span class="hint">点击下方日期</span>
          </div>
          <div class="calendar" id="calendar"></div>
          <div class="cal-legend">
            <span
              ><i
                style="background: linear-gradient(135deg, #6d5efc, #9d8aff)"
              ></i
              >已选择</span
            >
            <span
              ><i style="background: #fff; border: 1px solid var(--border)"></i
              >可选</span
            >
            <span
              ><i style="background: #fff1f2; border: 1px solid #ffe4e6"></i
              >不可选</span
            >
          </div>
        </div>

        <!-- 区块：当日时段 -->
        <div class="section">
          <div class="section-title">
            <span class="dot"></span>
            当日可预约时段
            <span class="hint" id="dateLabel">请先选择日期</span>
          </div>
          <div class="slots-wrap" id="slotsWrap">
            <div class="slots-empty">
              <span class="ico">📅</span>
              请先在上方选择预约日期
            </div>
          </div>
        </div>

        <!-- 区块：填写信息 -->
        <div class="section">
          <div class="section-title">
            <span class="dot"></span>
            填写预约信息
          </div>
          <div class="form-grid">
            <div class="form-item full">
              <label>VIP贵宾姓名 <span class="req">*</span></label>
              <input type="text" id="vipName" placeholder="请填写贵宾姓名" />
            </div>
            <div class="form-item">
              <label>贵宾年龄 <span class="req">*</span></label>
              <input
                type="number"
                id="vipAge"
                placeholder="年龄"
                min="1"
                max="120"
              />
            </div>
            <div class="form-item">
              <label>业务员姓名 <span class="req">*</span></label>
              <input type="text" id="salesName" placeholder="业务员" />
            </div>
            <div class="form-item full">
              <label>业务员电话 <span class="req">*</span></label>
              <input
                type="tel"
                id="salesPhone"
                placeholder="业务员手机号码"
                maxlength="11"
              />
            </div>
            <div class="form-item full">
              <label>备注</label>
              <textarea
                id="remark"
                placeholder="如有特殊需求请填写备注信息（选填）"
              ></textarea>
            </div>
          </div>
        </div>

        <button class="btn" id="submitBtn">提交预约</button>
        <div id="msgBox" class="msg"></div>
      </div>

      <div class="footer-note">© 2026 化妆预约系统 · 请提前预约，准时到达</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.addEventListener("error", (e) => {
        console.error("页面JS错误:", e.message, e.filename, "行" + e.lineno);
        const box = document.getElementById("msgBox");
        if (box) {
          box.className = "msg show error";
          box.innerText = "页面错误：" + e.message + "（行" + e.lineno + "）";
        }
      });

      const SUPABASE_URL = "https://eobszrywvvmsclrdgdsz.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_A-uYZoTTv70MVmLAoipE3g_kIcGcCsx";
      let supabaseClient = null;

      function initSupabase() {
        try {
          if (!window.supabase) {
            throw new Error("Supabase库未加载，请检查CDN网络");
          }
          const { createClient } = window.supabase;
          supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          console.log("✅ Supabase初始化成功");
        } catch (e) {
          console.error("❌ Supabase初始化失败:", e);
        }
      }

      const DATE_START = new Date(2026, 7, 21);
      const DATE_END = new Date(2026, 8, 2);
      const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

      const $ = (id) => document.getElementById(id);
      const calendar = $("calendar");
      const slotsWrap = $("slotsWrap");
      const dateLabel = $("dateLabel");
      const msgBox = $("msgBox");
      const submitBtn = $("submitBtn");

      let selectedDate = null;
      let selectedSlotId = null;

      function pad(n) {
        return String(n).padStart(2, "0");
      }
      function fmt(d) {
        return (
          d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
        );
      }

      function buildCalendar() {
        calendar.innerHTML = "";

        const availableDates = [];
        const start = new Date(2026, 7, 21);
        const end = new Date(2026, 8, 2);

        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
          availableDates.push(new Date(d));
        }

        const grouped = {};
        availableDates.forEach((date) => {
          const year = date.getFullYear();
          const month = date.getMonth();
          const key = `${year}-${month}`;
          if (!grouped[key]) {
            grouped[key] = [];
          }
          grouped[key].push(date);
        });

        Object.keys(grouped).forEach((key) => {
          const dates = grouped[key];
          const first = dates[0];
          const year = first.getFullYear();
          const month = first.getMonth();
          const monthName = month + 1 + "月";

          const mTitle = document.createElement("div");
          mTitle.className = "cal-month";
          mTitle.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block"></span>${year}年 ${monthName}`;
          calendar.appendChild(mTitle);

          const wd = document.createElement("div");
          wd.className = "cal-weekdays";
          WEEKDAYS.forEach((w, i) => {
            const el = document.createElement("div");
            el.className = "cal-weekday" + (i === 0 || i === 6 ? " we" : "");
            el.innerText = w;
            wd.appendChild(el);
          });
          calendar.appendChild(wd);

          const grid = document.createElement("div");
          grid.className = "cal-grid";

          const startWeekday = dates[0].getDay();
          for (let i = 0; i < startWeekday; i++) {
            const e = document.createElement("div");
            e.className = "cal-empty";
            grid.appendChild(e);
          }

          dates.forEach((cellDate) => {
            const btn = document.createElement("button");
            btn.className = "cal-day";
            btn.type = "button";
            btn.innerText = cellDate.getDate();

            const dow = cellDate.getDay();
            if (dow === 0 || dow === 6) {
              btn.classList.add("we");
            }

            btn.dataset.date = fmt(cellDate);
            btn.addEventListener("click", () =>
              selectDate(btn.dataset.date, btn),
            );

            grid.appendChild(btn);
          });

          calendar.appendChild(grid);
        });

        console.log("✅简洁版日历渲染完成");
      }

      function selectDate(dateVal, btnEl) {
        console.log("📆点击日期", dateVal);
        selectedDate = dateVal;
        selectedSlotId = null;
        calendar
          .querySelectorAll(".cal-day")
          .forEach((b) => b.classList.remove("active"));
        btnEl.classList.add("active");
        const [y, m, d] = dateVal.split("-");
        dateLabel.innerText = `${m}月${d}日`;
        setStep(2);
        loadSlots(dateVal);
      }

      async function loadSlots(dateVal) {
        slotsWrap.innerHTML = `<div class="slots-empty"><span class="ico">⏳</span>正在加载时段...</div>`;
        hideMsg();

        if (!supabaseClient) {
          slotsWrap.innerHTML = `<div class="slots-empty"><span class="ico">⚠️</span>数据库连接失败，请刷新页面</div>`;
          return;
        }
        console.log("🔍查询date_slot book_date=", dateVal);
        const { data, error } = await supabaseClient
          .from("date_slot")
          .select(`id, slot_id, max_people, used_people, time_slot(time_text)`)
          .eq("book_date", dateVal)
          .order("id")
          .setHeader("Cache-Control", "no-cache");

        console.log("📥返回", data, error);
        if (error) {
          slotsWrap.innerHTML = `<div class="slots-empty"><span class="ico">⚠️</span>读取失败：${escapeHtml(error.message)}</div>`;
          return;
        }
        if (!data || data.length === 0) {
          slotsWrap.innerHTML = `<div class="slots-empty"><span class="ico">😴</span>当日暂无预约时段</div>`;
          return;
        }
        const grid = document.createElement("div");
        grid.className = "slot-grid";

        data.forEach((rawItem) => {
          const max = rawItem.max_people || 0;
          const used = rawItem.used_people || 0;
          const remain = max - used;
          const ratio = max > 0 ? used / max : 0;
          const isFull = remain <= 0;
          const timeText = rawItem.time_slot?.time_text || "未知时段";

          const card = document.createElement("div");
          card.className = "slot-card" + (isFull ? " full" : "");
          const barClass = isFull ? "full" : ratio >= 0.6 ? "warn" : "ok";
          const widthPct = Math.min(100, Math.round(ratio * 100));
          card.innerHTML = `
            <div class="slot-time">${escapeHtml(timeText)}</div>
            <div class="slot-bar"><div class="slot-bar-fill ${barClass}" style="width:${widthPct}%"></div></div>
            <div class="slot-meta">
              <span>${isFull ? "已约满" : `剩余 ${remain}`}</span>
              <span class="slot-tag">${used}/${max}人</span>
            </div>`;
          if (!isFull) {
            card.onclick = () => {
              const timeSlotId = rawItem.slot_id;
              console.log("⏰选中time_slot id", timeSlotId);
              selectedSlotId = timeSlotId;
              grid
                .querySelectorAll(".slot-card")
                .forEach((c) => c.classList.remove("active"));
              card.classList.add("active");
              setStep(3);
            };
          }
          grid.appendChild(card);
        });
        slotsWrap.innerHTML = "";
        slotsWrap.appendChild(grid);
      }

      function setStep(n) {
        ["step1", "step2", "step3"].forEach((id, i) =>
          $(id).classList.toggle("active", i < n),
        );
      }

      function showMsg(text, type) {
        msgBox.className = "msg show " + type;
        msgBox.innerText = text;
      }
      function hideMsg() {
        msgBox.className = "msg";
        msgBox.innerText = "";
      }
      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      submitBtn.addEventListener("click", async () => {
        hideMsg();
        if (!supabaseClient)
          return showMsg("数据库未连接，请刷新页面", "error");
        const bookDate = selectedDate;
        const slotId = selectedSlotId;
        const vipName = $("vipName").value.trim();
        const vipAge = Number($("vipAge").value);
        const salesName = $("salesName").value.trim();
        const salesPhone = $("salesPhone").value.trim();
        const remark = $("remark").value.trim();

        if (!bookDate) return showMsg("请先选择预约日期", "error");
        if (!slotId) return showMsg("请选择预约时段", "error");
        if (!vipName) return showMsg("填写VIP贵宾姓名", "error");
        if (!vipAge || vipAge <= 0) return showMsg("填写正确贵宾年龄", "error");
        if (!salesName) return showMsg("填写业务员姓名", "error");
        if (!salesPhone) return showMsg("填写业务员电话", "error");

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>提交中...';

        const bookDateStr = selectedDate;
        const { data, error } = await supabaseClient.rpc("do_reserve", {
          p_book_date: bookDateStr,
          p_slot_id: slotId,
          p_vip_name: vipName,
          p_vip_age: vipAge,
          p_sales_name: salesName,
          p_sales_phone: salesPhone,
          p_remark: remark,
        });

        submitBtn.disabled = false;
        submitBtn.innerText = "提交预约";

        if (error) return showMsg("提交失败：" + error.message, "error");
        if (data === "full") {
          showMsg("⚠️该时段已满，请更换时段", "error");
          await new Promise((r) => setTimeout(r, 600));
          await loadSlots(bookDate);
        } else if (data === "ok") {
          showMsg("✅预约提交成功！", "ok");
          await new Promise((r) => setTimeout(r, 600));
          await loadSlots(bookDateStr);
          $("vipName").value = "";
          $("vipAge").value = "";
          $("salesName").value = "";
          $("salesPhone").value = "";
          $("remark").value = "";
          selectedSlotId = null;
        } else {
          showMsg(String(data), "error");
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        initSupabase();
        buildCalendar();
        console.log("🚀页面初始化全部完成");
      });
    </script>
  </body>
</html>
